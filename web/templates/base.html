<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Battery SOH{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('landing') }}">Battery SOH</a>
    <nav>
      <a href="{{ url_for('landing') }}" {% if active == 'home' %}class="current"{% endif %}>Home</a>
      <a href="{{ url_for('predict_get') }}" {% if active == 'predict' %}class="current"{% endif %}>Predictor</a>
    </nav>
  </header>
  {% block body %}{% endblock %}
</body>
</html>
